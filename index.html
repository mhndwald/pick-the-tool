<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pick the Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#151517;--card:#1D1D20;--line:#2E2E32;--tx:#F5F5F7;--mu:#A1A1A6;--red:#ba0200;--ok:#2f9e5b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:22px 20px 28px;display:flex;flex-direction:column}
.logo{height:54px;width:auto;display:block;margin-bottom:18px;align-self:flex-start}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--mu);text-transform:uppercase}
h1{font-size:40px;line-height:1.1;margin:10px 0 6px}
h2{font-size:24px;line-height:1.3;margin:14px 0 18px}
p.sub{color:var(--mu);font-size:17px;line-height:1.5}
hr.rule{border:0;height:3px;width:56px;background:var(--red);margin:14px 0 20px}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:16px 20px;font:700 19px Cairo,sans-serif;width:100%;cursor:pointer;margin-top:auto}
.btn.ghost{background:var(--card);border:1px solid var(--line);margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mu)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;font-size:21px;line-height:1.45;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 16px;font:700 19px Cairo,sans-serif;color:var(--tx);text-align:left;cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--ok)}
.opt.no{background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{min-height:64px;margin:14px 0 6px;font-size:16px;line-height:1.45;color:var(--mu)}
.fb b{color:var(--tx)}
.score{font-size:76px;font-weight:700;line-height:1}
.list{display:grid;gap:8px;margin:14px 0 18px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4}
.li .d{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
.li .d.y{background:var(--ok)}.li .d.n{background:var(--red)}
.li span.t{color:var(--mu)}
</style></head><body><div id="app"></div>
